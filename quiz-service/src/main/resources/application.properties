# =====================================================================
# IntelliLearn - Quiz & Assessment Service  (Port 8081)
# =====================================================================
spring.application.name=quiz-service
server.port=8081

# ---- In-memory database (H2) ----------------------------------------
spring.datasource.url=jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate -------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---- Jackson -----------------------------------------------------------
# Reject fractional numbers for int fields (e.g. answer index 1.5) instead
# of silently truncating them.
spring.jackson.deserialization.accept-float-as-int=false

# ---- H2 web console (http://localhost:8081/h2-console) ----------------
# Disabled by default: the console is only guarded by the shared API key and
# is not reachable from a browser (which cannot send the X-API-Key header),
# so it would be dead weight. Enable it for a local demo with:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--spring.h2.console.enabled=true
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---- OpenAPI / Swagger UI --------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# ---- API Key security --------------------------------------------------
# Every request to this service (except Swagger endpoints) must send:
#   X-API-Key: INTELLILEARN-QUIZ-KEY-2026
# NOTE: This key is a shared development secret. In production it should be
# injected via an environment variable, not committed to source control.
intellilearn.api-key=INTELLILEARN-QUIZ-KEY-2026
