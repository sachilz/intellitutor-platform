# =====================================================================
# IntelliLearn - Quiz & Assessment Service  (Port 8083)
# =====================================================================
spring.application.name=quiz-service
server.port=8083

# ---- MongoDB connection ----------------------------------------------
spring.data.mongodb.database=quizdb
spring.data.mongodb.uri=${QUIZ_SERVICE_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/quizdb}}

# ---- In-memory database (H2 fallback for JPA) ------------------------
spring.datasource.url=jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate -------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---- Jackson -----------------------------------------------------------
spring.jackson.deserialization.accept-float-as-int=false

# ---- H2 web console --------------------------------------------------
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---- OpenAPI / Swagger UI --------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# ---- API Key security --------------------------------------------------
security.api-key=${SECURITY_API_KEY:${QUIZ_SERVICE_API_KEY:quiz-service-secret-key-101}}
intellilearn.api-key=${SECURITY_API_KEY:${QUIZ_SERVICE_API_KEY:quiz-service-secret-key-101}}
