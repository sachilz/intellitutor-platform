# =====================================================================
# IntelliLearn - AI Tutor Microservice (Port 8085)
# =====================================================================
spring.application.name=tutor-service
server.port=8085

# ---- MongoDB Connection ---------------------------------------------
spring.data.mongodb.database=tutordb
spring.data.mongodb.uri=${TUTOR_SERVICE_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/tutordb}}

# ---- OpenAPI / Swagger UI -------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Security & API Key ---------------------------------------------
security.api-key=${SECURITY_API_KEY:${TUTOR_SERVICE_API_KEY:tutor-service-secret-key-999}}

# ---- LLM Provider API Keys (Optional Server Fallbacks) --------------
OPENAI_API_KEY=${OPENAI_API_KEY:}
GEMINI_API_KEY=${GEMINI_API_KEY:}
GROQ_API_KEY=${GROQ_API_KEY:}

