spring.application.name=progress-service
server.port=8084
spring.data.mongodb.database=progressdb
spring.data.mongodb.uri=${PROGRESS_SERVICE_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/progressdb}}
security.api-key=${PROGRESS_SERVICE_API_KEY:progress-service-secret-key-789}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

