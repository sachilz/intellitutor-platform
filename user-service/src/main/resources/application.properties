spring.application.name=user-service
server.port=8081
spring.data.mongodb.database=userdb
spring.data.mongodb.uri=${USER_SERVICE_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/userdb}}
security.api-key=${USER_SERVICE_API_KEY:user-service-secret-key-123}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html