server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - X-API-KEY
              - Authorization
              - Content-Type
              - "*"
            allowCredentials: true

      routes:
        - id: user-service-users
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/courses/**
          filters:
            - StripPrefix=1

      mvc:
        routes:
          - id: user-service-users
            uri: http://localhost:8081
            predicates:
              - Path=/api/users/**
            filters:
              - StripPrefix=1

          - id: user-service-auth
            uri: http://localhost:8081
            predicates:
              - Path=/api/auth/**
            filters:
              - StripPrefix=1

          - id: course-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/courses/**
            filters:
              - StripPrefix=1
