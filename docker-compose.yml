services:
  # 1. MongoDB Service (Persistent Database Volume)
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  # 2. Redis service for API Gateway rate limiting
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  # 3. Keycloak IAM service for OAuth2 authentication
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8180:8080"

  # 4. User Service microservice
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      - USER_SERVICE_MONGODB_URI=${USER_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/userdb}
      - MONGODB_URI=${USER_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/userdb}
      - USER_SERVICE_API_KEY=${USER_SERVICE_API_KEY:-user-service-secret-key-123}
      - SECURITY_API_KEY=${USER_SERVICE_API_KEY:-user-service-secret-key-123}

  # 5. Course Service microservice
  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: course-service
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      - COURSE_SERVICE_MONGODB_URI=${COURSE_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/coursedb}
      - MONGODB_URI=${COURSE_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/coursedb}
      - COURSE_SERVICE_API_KEY=${COURSE_SERVICE_API_KEY:-course-service-secret-key-456}
      - SECURITY_API_KEY=${COURSE_SERVICE_API_KEY:-course-service-secret-key-456}

  # 6. Quiz & Assessment Service microservice
  quiz-service:
    build:
      context: ./quiz-service
      dockerfile: Dockerfile
    container_name: quiz-service
    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      - QUIZ_SERVICE_MONGODB_URI=${QUIZ_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/quizdb}
      - MONGODB_URI=${QUIZ_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/quizdb}
      - SECURITY_API_KEY=quiz-service-secret-key-101

  # 7. Learning Progress Service microservice
  progress-service:
    build:
      context: ./progress-service
      dockerfile: Dockerfile
    container_name: progress-service
    ports:
      - "8084:8084"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      - PROGRESS_SERVICE_MONGODB_URI=${PROGRESS_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/progressdb}
      - MONGODB_URI=${PROGRESS_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/progressdb}
      - PROGRESS_SERVICE_API_KEY=${PROGRESS_SERVICE_API_KEY:-progress-service-secret-key-789}
      - SECURITY_API_KEY=${PROGRESS_SERVICE_API_KEY:-progress-service-secret-key-789}

  # 8. AI Tutor RAG Service microservice
  tutor-service:
    build:
      context: ./tutor-service
      dockerfile: Dockerfile
    container_name: tutor-service
    ports:
      - "8085:8085"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      - TUTOR_SERVICE_MONGODB_URI=${TUTOR_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/tutordb}
      - MONGODB_URI=${TUTOR_SERVICE_MONGODB_URI:-mongodb://mongodb:27017/tutordb}
      - SECURITY_API_KEY=tutor-service-secret-key-999
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}

  # 9. API Gateway routing & security entry point
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      user-service:
        condition: service_started
      course-service:
        condition: service_started
      quiz-service:
        condition: service_started
      progress-service:
        condition: service_started
      tutor-service:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/intellilearn
      - USER_SERVICE_URL=http://user-service:8081
      - COURSE_SERVICE_URL=http://course-service:8082
      - QUIZ_SERVICE_URL=http://quiz-service:8083
      - PROGRESS_SERVICE_URL=http://progress-service:8084
      - TUTOR_SERVICE_URL=http://tutor-service:8085

  # 10. React Client Frontend Container
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  mongodb-data:
